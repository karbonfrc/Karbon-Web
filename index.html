<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Karbon Burnt</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #131313;
        --panel: #181818;
        --border: #2a2a2a;
        --border-bright: #3a3a3a;
        --fg: #f0f0f0;
        --muted: #777777;
        --faint: #383838;
        --accent: #f97316;
        --accent-bright: #fb923c;
        --accent-dim: #7c3a0e;
        --accent-glow: rgba(249,115,22,0.07);
        --accent-glow-strong: rgba(249,115,22,0.10);
        --sans: 'Space Grotesk', system-ui, sans-serif;
        --mono: 'JetBrains Mono', Consolas, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      img {
        -webkit-user-drag: none;
        user-select: none;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 0 16px 48px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.035), transparent 48%),
          var(--bg);
      }

      .topbar {
        width: calc(100% + 32px);
        margin-left: -16px;
        margin-right: -16px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(19,19,19,0.72);
        margin-bottom: 38px;
        gap: 9px;
        min-height: 48px;
        position: relative;
        left: 0; right: 0;
      }
      .topbar-name {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid rgba(255,255,255,0.075);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 24px 70px rgba(0,0,0,0.14), 0 5px 20px rgba(0,0,0,0.07);
      }

      .logo-box {
        padding: 32px 28px 28px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
      }
      .logo-img {
        width: 110px;
        height: 110px;
        object-fit: contain;
        border-radius: 12px;
        display: block;
        box-shadow: none;
      }

      .controls {
        padding: 27px 22px 25px;
      }

      .lede {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 16px;
        text-align: center;
      }
      .lede .soon {
        color: var(--accent);
        opacity: 0.75;
      }

      .tool-card { width:100%; margin:0 0 18px; padding:14px; border:1px solid var(--border); border-radius:12px; background:#151515; }
.tool-heading { margin:0 0 10px; color:#e5e5e5; font:600 11px/1.4 var(--mono); letter-spacing:.1em; text-transform:uppercase; }
.check-row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid #242424; font:11px/1.4 var(--mono); }
.check-label { color:#999; }
.check-value { color:#f2f2f2; text-align:right; }
.check-value.ok { color:#86d39b; }
.check-value.bad { color:#f2c14e; }
.support-toast { position:fixed; right:20px; bottom:20px; z-index:30; display:flex; align-items:center; gap:11px; max-width:calc(100vw - 32px); padding:13px 17px; border:1px solid #35543d; border-radius:12px; background:#1b2920; color:#e8f6eb; box-shadow:0 12px 32px #0008; font:600 13px/1.3 var(--sans); opacity:0; pointer-events:none; transform:translateX(32px); }
.support-toast.show { animation:supportToast 3s cubic-bezier(.2,.75,.25,1) both; }
.support-toast.unsupported { border-color:#65413f; background:#2b1d1c; color:#ffe9e7; }
.support-toast-icon { display:grid; width:24px; height:24px; flex:none; place-items:center; border:2px solid #69c17a; border-radius:50%; color:#82dc92; font-size:16px; }
.support-toast.unsupported .support-toast-icon { border-color:#ed827a; color:#ff9189; }
@keyframes supportToast { 0% { opacity:0; transform:translateX(32px); } 12%,78% { opacity:1; transform:translateX(0); } 100% { opacity:0; transform:translateX(24px); } }
.tool-link { display:block; margin-top:10px; color:#c8c8c8; font:11px/1.5 var(--mono); text-align:center; text-decoration:underline; text-underline-offset:3px; }
      .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 17px;
      }

      .opt {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
        background: var(--panel);
        user-select: none;
      }
      .opt:hover {
        border-color: #70401f;
        background: #1d1916;
        transform: translateY(-1px);
      }
      .opt:focus-within {
        outline: none;
      }
      .opt input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        border: 2px solid var(--faint);
        flex-shrink: 0;
        transition: border-color 0.18s ease;
        cursor: pointer;
      }
      .opt input[type="radio"]:checked {
        border-color: var(--accent);
        background: radial-gradient(circle, var(--accent) 36%, transparent 38%);
      }
      .opt:has(input:checked) {
        border-color: #9a4b19;
        background: #1d1916;
      }
      .opt-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--fg);
        flex: 1;
        line-height: 1.2;
      }
      .opt-tag {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--accent);
        background: rgba(249,115,22,0.08);
        border: 1px solid #553018;
        padding: 3px 6px;
        border-radius: 4px;
        white-space: nowrap;
        line-height: 1.2;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: var(--accent);
        color: #0a0a0a;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: background 0.2s ease, transform 0.18s ease;
      }
      .btn:hover { background: var(--accent-bright); }
      .btn:active { transform: translateY(1px); }
      .btn:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 3px;
      }

      .btn.loading {
        background: #a34100 !important;
        color: #e0e0e0 !important;
        pointer-events: none !important;
        cursor: not-allowed !important;
        letter-spacing: 0.10em !important;
      }

      .loading-screen { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(18,18,18,.96); }
.loading-screen.visible { display:flex; }
.loading-panel { width:min(280px,calc(100% - 48px)); padding:24px; border:1px solid #383838; border-radius:10px; background:#202020; text-align:center; }
.loading-label { margin:0 0 14px; color:#f2f2f2; font:600 12px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase; }
.loading-track { height:4px; overflow:hidden; border-radius:999px; background:#383838; }
.loading-fill { width:38%; height:100%; border-radius:inherit; background:#aaa; animation:loadingSlide 1s ease-in-out infinite; }
@keyframes loadingSlide { from { transform:translateX(-110%); } to { transform:translateX(270%); } }
      .btn-spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.65s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .status-row {
        min-height: 18px;
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .count, .cache-note {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        margin: 0;
        min-height: 1em;
      }

      .package-link { margin-top:18px; color:#bbb; font:11px/1.5 var(--mono); text-decoration:underline; text-underline-offset:3px; }

      .byline {
        margin-top: 22px;
        font-size: 10px;
        font-family: var(--mono);
        color: var(--faint);
        letter-spacing: 0.08em;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .card { animation: fadeUp 0.4s ease both; }
      .topbar { animation: fadeUp 0.25s ease both; }

      @media (max-width: 420px) {
        body { padding-inline: 12px; }
        .topbar {
          width: calc(100% + 24px);
          margin-left: -12px;
          margin-right: -12px;
          margin-bottom: 28px;
        }
        .card { border-radius: 14px; }
        .controls { padding: 22px 17px 21px; }
        .logo-box { padding: 27px 20px 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="support-toast" id="supportToast" role="status" aria-live="polite">
      <span class="support-toast-icon" id="supportToastIcon" aria-hidden="true">✓</span>
      <span id="supportToastText"></span>
    </div>
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
      <div class="loading-panel"><p class="loading-label">Loading Karbon</p><div class="loading-track"><div class="loading-fill"></div></div></div>
    </div>
    <div class="topbar">
      <div class="topbar-dot"></div>
      <span class="topbar-name">Karbon Burnt</span>
      <div class="topbar-dot"></div>
    </div>

    <div class="card">
      <div class="logo-box">
        <img class="logo-img" src="logo.png" alt="Karbon Burnt" />
      </div>

      <div class="controls">
        <p class="lede">PS4 FW 12.00 &ndash; 14.00 <span class="soon">&middot; 14.02 soon</span></p>

        <!-- Use a clean div instead of a form to completely bypass browser form-handling quirks -->
        <div id="pick">
          <div class="options">
            <label class="opt">
              <input type="radio" name="payload" value="goldhen" checked />
              <span class="opt-label">GoldHEN</span>
              <span class="opt-tag">Recommended</span>
            </label>
            <label class="opt">
              <input type="radio" name="payload" value="hen" />
              <span class="opt-label">Ps4-Hen</span>
              <span class="opt-tag">Base</span>
            </label>
          </div>

          <button class="btn" type="button" id="startBtn">Start</button>

          <div class="status-row">
            <p class="count" id="count"></p>
            <p class="cache-note" id="cache" aria-live="polite"></p>
          </div>
        </div>
      </div>
    </div>

    <p class="byline">by Karbon</p>
    
    <script type="module">
      import { offsetsFor, KARBON_SUPPORTED_FIRMWARES } from "./ps4_offsets.js";
      const firmware = offsetsFor(navigator.userAgent).key;
      const packageLink = document.querySelector(".package-link");
      if (packageLink) packageLink.hidden = !!firmware;
      const isSupported = !!firmware && KARBON_SUPPORTED_FIRMWARES.includes(firmware);
      const toast = document.getElementById("supportToast");
      const toastText = document.getElementById("supportToastText");
      const toastIcon = document.getElementById("supportToastIcon");
      toast.classList.toggle("unsupported", !isSupported);
      toastText.textContent = isSupported ? "Your Playstation is Supported" : "Your Playstation is NOT Supported";
      toastIcon.textContent = isSupported ? "✓" : "×";
      requestAnimationFrame(() => toast.classList.add("show"));
    </script>
    <script src="launch.js"></script>
  </body>
</html>

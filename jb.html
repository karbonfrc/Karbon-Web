<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Karbon Burnt</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <style>
      :root {
        --bg: #111111;
        --surface: #1a1a1a;
        --panel: #202020;
        --border: #2e2e2e;
        --fg: #f0f0f0;
        --muted: #888888;
        --faint: #444444;
        --accent: #f97316;
        --ok: #4ade80;
        --bad: #f87171;
        --warn: #fbbf24;
        --sans: 'Space Grotesk', system-ui, sans-serif;
        --mono: 'JetBrains Mono', Consolas, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      img {
        -webkit-user-drag: none;
        user-select: none;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
      }

      /* Top bar */
      #brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }
      #brand b {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .brand-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
      }

      #ramBox {
        padding: 7px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        font: 11px/1.6 var(--mono);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
        letter-spacing: 0.03em;
      }

      #loadingArea { display:none; }
      #loadingArea {
        padding: 9px 16px 12px;
        border-bottom: 1px solid #303030;
        background: var(--bg);
        flex-shrink: 0;
      }
      #spin {
        position: relative;
        width: min(190px, calc(100% - 48px));
        height: 3px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 999px;
        background: #292929;
      }
      #spin::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 -38%;
        width: 38%;
        border-radius: inherit;
        background: var(--accent);
        animation: loadSlide 1.25s ease-in-out infinite;
      }
      .loading-screen { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(18,18,18,.96); transition:opacity .18s ease; }
.loading-screen.hidden { opacity:0; pointer-events:none; }
.loading-panel { width:min(280px,calc(100% - 48px)); padding:24px; border:1px solid #383838; border-radius:10px; background:#202020; text-align:center; }
.loading-label { margin:0 0 14px; color:#f2f2f2; font:600 12px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase; }
.loading-track { height:4px; overflow:hidden; border-radius:999px; background:#383838; }
.loading-fill { width:38%; height:100%; border-radius:inherit; background:#aaa; animation:loadingSlide 1s ease-in-out infinite; }
@keyframes loadingSlide { from { transform:translateX(-110%); } to { transform:translateX(270%); } }
      @keyframes loadSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(365%); }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0; right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0 24px;
      }

      #state { display: none !important; }
      #out { display: none; }

      body.done #spin, body.fail #spin { display: none; }
      body.fail #msg { display: block; color: var(--bad); }
      body.done #msg { display: block; color: var(--accent); letter-spacing: 0.18em; }

      .notice {
        margin: 12px 16px;
        padding: 12px 16px;
        border: 1px solid var(--bad);
        border-left: 3px solid var(--bad);
        background: rgba(248,113,113,0.07);
        color: var(--bad);
        font: 600 13px/1.5 var(--sans);
        border-radius: 8px;
      }

      body.log {
        display: flex;
        flex-direction: column;
      }
      body.log #msg { display: none; }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 16px 20px;
        gap: 10px;
      }

      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 14px;
        border: 1px solid #222222;
        border-radius: 8px;
        background: #151515;
        font: 13px/1.7 var(--mono);
        white-space: pre-wrap;
        color: #f2f2f2;
      }

      .log-line {
        display: flex;
        gap: 10px;
      }
      .log-time { color:#888; flex-shrink:0; }
.log-text { color:#f2f2f2; }
.log-line.warning .log-text { color:#fbbf24; }
.log-line.error .log-text { color:#f87171; }

      .byline {
        position: fixed;
        bottom: 9px;
        left: 12px;
        margin: 0;
        color: var(--faint);
        font: 10px/1 var(--mono);
        letter-spacing: 0.06em;
      }

      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .warn { color: var(--warn); }
      code { color: #b4c7d8; }

      @media (prefers-reduced-motion: reduce) {
        #spin::after { animation-duration: 3s; }
      }
    </style>
  </head>
  <body class="log">
    <div id="brand">
      <b>Karbon Burnt</b>
    </div>
    <div id="ramBox">RAM: initializing...</div>
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
      <div class="loading-panel"><p class="loading-label">Loading Karbon</p><div class="loading-track"><div class="loading-fill"></div></div></div>
    </div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">by well0nez/m0zz</p>
    <script>
      (() => {
        const out = document.getElementById("out");
        let welcomed = false;

        const getTimestamp = () => {
          const d = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          return `[${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}]`;
        };

        const createLogLine = (text, color = null, weight = null) => {
          const line = document.createElement("div");
          line.className = "log-line";

          const timeSpan = document.createElement("span");
          timeSpan.className = "log-time";
          timeSpan.textContent = getTimestamp();

          const textSpan = document.createElement("span");
          textSpan.textContent = text;
          if (color) textSpan.style.color = color;
          if (weight) textSpan.style.fontWeight = weight;

          line.appendChild(timeSpan);
          line.appendChild(textSpan);
          return line;
        };

        const addWelcome = () => {
          if (welcomed || !out || !document.body.classList.contains("log")) return;

          const welcomeLine = createLogLine("Welcome to Karbon-Ps4!", "#fbbf24", "600");
          out.prepend(welcomeLine);
          welcomed = true;
        };

        if (!document.body.classList.contains("log")) {
          document.body.classList.add("log", "done");
        }

        addWelcome();
        setTimeout(() => {
          const loader = document.getElementById("loadingScreen");
          if (loader) loader.classList.add("hidden");
        }, 450);
      })();
    </script>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
